name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  uno-bench:
    name: UNO LED software bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install cryptography
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Native LED guard and signed host scenarios
        shell: bash
        run: |
          # This is an ephemeral software fixture, not a disk durability test.
          # Keep fsync-heavy signed checkpoints off shared hosted-runner disks.
          if [ -d /dev/shm ] && [ -w /dev/shm ]; then
            bench_tmp=$(mktemp -d /dev/shm/haetae-bench.XXXXXX)
            trap 'rm -rf "$bench_tmp"' EXIT
            export TMPDIR="$bench_tmp"
          elif [ "$RUNNER_OS" = macOS ]; then
            # Format only the new RAM-backed device returned by this attach.
            bench_ram=$(hdiutil attach -nomount ram://262144 | tr -d '[:space:]')
            [[ "$bench_ram" =~ ^/dev/disk[0-9]+$ ]]
            trap 'hdiutil detach "$bench_ram"' EXIT
            bench_label="HaetaeBench${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
            diskutil eraseVolume HFS+ "$bench_label" "$bench_ram"
            bench_tmp=$(mktemp -d "/Volumes/$bench_label/haetae-bench.XXXXXX")
            export TMPDIR="$bench_tmp"
          fi
          ./haetae-bench verify
          ./haetae-permit verify
      - name: Authorizer and gateway UID separation
        if: runner.os == 'Linux'
        run: sudo -E env PATH="$PATH" python3 haetae-permit verify-isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-bench-${{ matrix.os }}
          path: artifacts/bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-permit-${{ matrix.os }}
          # Never upload provisioning seeds, generated header or device image.
          path: |
            artifacts/controller-permit/report.json
            artifacts/controller-permit/isolation-report.json
            artifacts/controller-permit/*.jsonl
            artifacts/controller-permit/*-relay.log
            artifacts/controller-permit/*-authorizer.log

  uno-firmware:
    name: UNO R4 Minima firmware compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: ./haetae-bench compile
      - run: python -m pip install cryptography
      - name: Compile device-specific hardened controller firmware
        run: |
          ./haetae-permit provision --directory artifacts/ci-permit-private
          ./haetae-permit compile --deployment artifacts/ci-permit-private/deployment.json \
            --controller-key artifacts/ci-permit-private/controller.seed
      - uses: actions/upload-artifact@v4
        with:
          name: uno-r4-led-firmware
          path: artifacts/uno-r4-build/uno_r4_bench.ino.bin

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  wasm:
    name: WASM simulator build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked \
            | python3 -c "import sys,json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='wasm-bindgen'))")
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - run: node --test sim/*.test.mjs
      - run: sim/build.sh
      - run: test -s sim/pkg/haetae_wasm_bg.wasm && test -s sim/pkg/haetae_wasm.js

  dinner-party:
    name: Dinner-party demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: keygen → judge → verify → replay
        run: |
          PK=$(target/debug/haetae keygen --out "$RUNNER_TEMP/key.seed")
          target/debug/haetae judge \
            --policy examples/dinner-party/policy.json \
            --world examples/dinner-party/world.json \
            --proposals examples/dinner-party/proposals.jsonl \
            --sillok "$RUNNER_TEMP/sillok.jsonl" --key "$RUNNER_TEMP/key.seed"
          target/debug/haetae sillok verify --log "$RUNNER_TEMP/sillok.jsonl" --pubkey "$PK" \
            | tee "$RUNNER_TEMP/report.json"
          grep -q '"fully_sealed": true' "$RUNNER_TEMP/report.json"
          {
            echo '### Dinner-party replay'
            echo '```'
            target/debug/haetae sillok replay --log "$RUNNER_TEMP/sillok.jsonl" --pubkey "$PK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m pip install build
      - run: python -m build python/
      - run: |
          pip install python/dist/*.whl
          python -c "from haetae import Verdict as V; assert V.YUN.stricter(V.BUL) is V.BUL"

  ros-smoke:
    name: ROS 2 Jazzy smoke
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v7
      - name: JSON over std_msgs/String, node-clock recv_ms
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 ros/smoke/json_roundtrip.py
      - name: Gate transport imports
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-cryptography ros-jazzy-control-msgs ros-jazzy-trajectory-msgs
          source /opt/ros/jazzy/setup.bash
          PYTHONPATH=ros/haetae_gate:$PYTHONPATH python3 -c 'import node; import bridge; import signing'

  gate-python:
    name: ROS bridge and signing core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s ros/haetae_gate -p 'test_*.py' -v
      - run: python -m unittest discover -s ros/security -p 'test_*.py' -v

  sros-policy:
    name: SROS2 permission generation
    runs-on: ubuntu-latest
    container: ros:jazzy
    env:
      ROS_DOMAIN_ID: 79
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    steps:
      - uses: actions/checkout@v7
      - name: Generate role-specific signed permissions
        shell: bash
        run: |
          apt-get update
          apt-get install -y ros-jazzy-sros2 ros-jazzy-rmw-fastrtps-cpp ros-jazzy-control-msgs ros-jazzy-trajectory-msgs
          source /opt/ros/jazzy/setup.bash
          store=$(mktemp -d)
          ros2 security create_keystore "$store"
          for enclave in /haetae/gate /haetae/world /haetae/vla /haetae/controller; do
            ros2 security create_enclave "$store" "$enclave"
            ros2 security create_permission "$store" "$enclave" ros/security/haetae.policy.xml
            test -s "$store/enclaves$enclave/permissions.p7s"
          done
          python3 ros/security/secure_probe.py orchestrate "$store"

  build-linux:
    name: Linux gate binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p haetae
      - uses: actions/upload-artifact@v4
        with:
          name: haetae-linux
          path: target/release/haetae

  ros-gate-e2e:
    name: ROS 2 signed gate smoke
    needs: build-linux
    runs-on: ubuntu-latest
    container: ros:jazzy
    env:
      ROS_DOMAIN_ID: 76
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: haetae-linux
          path: bin
      - name: Signed world and VLA through ROS to base output
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-cryptography ros-jazzy-rmw-fastrtps-cpp ros-jazzy-control-msgs ros-jazzy-trajectory-msgs
          source /opt/ros/jazzy/setup.bash
          chmod +x bin/haetae
          python3 ros/smoke/enforce_roundtrip.py bin/haetae
          ROS_DOMAIN_ID=80 python3 ros/smoke/enforce_roundtrip.py bin/haetae --unstamped

  ros-sim-e2e:
    name: ROS 2 reference scenarios
    needs: build-linux
    runs-on: ubuntu-latest
    container: ros:jazzy
    env:
      ROS_DOMAIN_ID: 77
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: haetae-linux
          path: bin
      - name: Run eight scenarios five times
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-cryptography ros-jazzy-rmw-fastrtps-cpp ros-jazzy-control-msgs ros-jazzy-trajectory-msgs ros-jazzy-nav-msgs ros-jazzy-rosgraph-msgs
          source /opt/ros/jazzy/setup.bash
          chmod +x bin/haetae
          python3 -m unittest discover -s ros/haetae_sim -p 'test_*.py' -v
          for repeat in 1 2 3 4 5; do
            for scenario in 1 2 3 4 5 6 7 8; do
              python3 ros/haetae_sim/run_scenario.py bin/haetae "$scenario" --repeat "$repeat" --out "artifacts/ros-e2e/$scenario-$repeat"
            done
          done
          python3 ros/haetae_sim/summarize.py artifacts/ros-e2e >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-e2e-evidence
          path: artifacts/ros-e2e
          if-no-files-found: warn

  ros-arm-e2e:
    name: ROS 2 arm action reference
    needs: build-linux
    runs-on: ubuntu-latest
    container: ros:jazzy
    env:
      ROS_DOMAIN_ID: 78
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: haetae-linux
          path: bin
      - name: Signed arm action, cancellation and deadman
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-cryptography ros-jazzy-rmw-fastrtps-cpp ros-jazzy-control-msgs ros-jazzy-trajectory-msgs ros-jazzy-nav-msgs ros-jazzy-rosgraph-msgs
          source /opt/ros/jazzy/setup.bash
          chmod +x bin/haetae
          export HAETAE_REVISION="${GITHUB_SHA:?missing event commit}"
          python3 ros/haetae_sim/arm_smoke.py bin/haetae --out artifacts/ros-arm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-arm-evidence
          path: artifacts/ros-arm
          if-no-files-found: warn

  gazebo-reference:
    name: Gazebo physics base and arm reference
    needs: build-linux
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
      options: --cap-add=NET_ADMIN
    env:
      ROS_DOMAIN_ID: 81
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: haetae-linux
          path: bin
      - name: Gazebo Harmonic with ros2_control controllers
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-cryptography python3-seccomp iptables iproute2 ros-jazzy-rmw-fastrtps-cpp xvfb libgl1-mesa-dri \
            ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-ros2-controllers \
            libssl-dev ros-jazzy-controller-manager ros-jazzy-robot-state-publisher ros-jazzy-xacro
          source /opt/ros/jazzy/setup.bash
          chmod +x bin/haetae
          colcon --log-base /tmp/guard-log build --base-paths ros/haetae_arm_guard ros/haetae_scene \
            --merge-install --build-base /tmp/guard-build --install-base /opt/haetae
          ctest --test-dir /tmp/guard-build/haetae_arm_guard --output-on-failure
          ctest --test-dir /tmp/guard-build/haetae_scene --output-on-failure
          source /opt/haetae/setup.bash
          python3 -m unittest discover -s ros/gazebo -p 'test_*.py' -v
          python3 ros/gazebo/check_live_stream.py --port 8765 \
            --out artifacts/gazebo-reference/live-stream.jsonl --timeout-seconds 300 &
          live_checker=$!
          # Container checkout ownership can differ from the step user.
          # GITHUB_SHA is the same event commit checked out by both evidence and package jobs.
          export HAETAE_REVISION="${GITHUB_SHA:?missing event commit}"
          python3 ros/gazebo/run_reference.py bin/haetae \
            --out artifacts/gazebo-reference --live-port 8765 --wait-for-viewer \
            --secure-graph --attack-probes --compound-repeat 6 \
            --live-hold-seconds 0
          wait "$live_checker"
          python3 ros/gazebo/run_reference.py bin/haetae --secure-graph --household-hazards \
            --out artifacts/gazebo-reference/household-hazards --live-hold-seconds 0
          python3 -c 'import json; r=json.load(open("artifacts/gazebo-reference/household-hazards/verification-report.json")); assert r["status"] == "passed" and r["scope"] == "household_hazard_mandatory_gate_simulation" and len(r["checks"]) == 12'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gazebo-reference-evidence
          path: artifacts/gazebo-reference
          if-no-files-found: warn

  simulator-alpha-package:
    name: Simulator alpha source and verification report
    needs: gazebo-reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: gazebo-reference-evidence
          path: artifacts/alpha-evidence
      - name: Package passing evidence and committed source
        run: python3 tools/package_simulator_alpha.py --result artifacts/alpha-evidence/result.json --household-result artifacts/alpha-evidence/household-hazards/result.json --out artifacts/simulator-alpha
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-alpha-candidate
          path: artifacts/simulator-alpha
