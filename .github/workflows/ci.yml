name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  dinner-party:
    name: Dinner-party demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: keygen → judge → verify → replay
        run: |
          PK=$(target/debug/haetae keygen --out "$RUNNER_TEMP/key.seed")
          target/debug/haetae judge \
            --policy examples/dinner-party/policy.json \
            --world examples/dinner-party/world.json \
            --proposals examples/dinner-party/proposals.jsonl \
            --sillok "$RUNNER_TEMP/sillok.jsonl" --key "$RUNNER_TEMP/key.seed"
          target/debug/haetae sillok verify --log "$RUNNER_TEMP/sillok.jsonl" --pubkey "$PK" \
            | tee "$RUNNER_TEMP/report.json"
          grep -q '"fully_sealed": true' "$RUNNER_TEMP/report.json"
          {
            echo '### Dinner-party replay'
            echo '```'
            target/debug/haetae sillok replay --log "$RUNNER_TEMP/sillok.jsonl" --pubkey "$PK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m pip install build
      - run: python -m build python/
      - run: |
          pip install python/dist/*.whl
          python -c "from haetae import Verdict as V; assert V.YUN.stricter(V.BUL) is V.BUL"
