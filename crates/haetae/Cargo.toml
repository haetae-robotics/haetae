[package]
name = "haetae"
description = "Supervisory policy gate for AI-driven robots: judges untrusted model output before it reaches actuators (non-safety-rated, pre-alpha)"
readme = "README.md"
keywords = ["robotics", "safety", "security", "ros2", "guardrail"]
categories = ["science::robotics"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
haetae-core.workspace = true
haetae-runtime.workspace = true
haetae-enforce.workspace = true
sillok.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
