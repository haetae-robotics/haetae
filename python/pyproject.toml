[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "haetae"
version = "0.0.1"
description = "A permit gate for AI-driven robots: actuators accept only exactly-authorized, fresh commands, and incidents leave a verifiable record. Pre-alpha, not safety-rated."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["robotics", "authorization", "security", "ros2", "guardrail"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/haetae-robotics/haetae"
